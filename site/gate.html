<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noeon 审批</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./playground.css" />
    <style>
      .gate-page { max-width: 960px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      .gate-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 0.75rem; }
      .gate-table th, .gate-table td { padding: 0.55rem 0.65rem; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; }
      .gate-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
      .gate-actions button { font-size: 0.8rem; padding: 0.25rem 0.55rem; }
      .status-pass { color: #3dd68c; }
    </style>
  </head>
  <body class="playground-body">
    <header class="topbar">
      <div class="container nav-wrap">
        <div class="brand"><a href="./index.html">Noeon</a> / 审批</div>
        <nav>
          <a href="./index.html">首页</a>
          <a href="./playground.html">体验</a>
        </nav>
      </div>
    </header>

    <main class="gate-page container">
      <h1>人工审批</h1>
      <p>处理需要人工确认的操作请求。</p>

      <div class="fusion-controls" style="margin:1rem 0;">
        <button id="btn-refresh-human" class="btn primary">刷新</button>
        <label><input id="auto-human" type="checkbox" checked /> 自动刷新</label>
      </div>
      <p id="gate-stats" class="stats">加载中…</p>
      <table class="gate-table">
        <thead>
          <tr><th>时间</th><th>操作</th><th>来源</th><th>说明</th><th>编号</th><th></th></tr>
        </thead>
        <tbody id="gate-body"></tbody>
      </table>
    </main>

    <script src="./gate.js"></script>
  </body>
</html>
