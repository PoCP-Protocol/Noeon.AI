name: alpha-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  alpha-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run gate:alpha
      - run: node src/cli.js doctor --json
